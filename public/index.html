<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Stars History Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        // Shared style configuration - matches server.js getStyleConfig()
        const STYLE_CONFIG = {

                pointStrokeWidth: 2.5,

                gridColor: 'rgba(255, 255, 255, 0.2)',
                textColor: '#ffffff',
                legendTextColor: '#ffffff',
                tickColor: 'rgba(255, 255, 255, 0.9)',
                title: '⭐ GitHub Stars Over Time',
                titleSize: 24,
                titleWeight: 700,
                showEmoji: true
            },
            dark: {
                colors: ['#8b5cf6', '#ec4899', '#06b6d4', '#10b981', '#f59e0b', '#ef4444', '#6366f1', '#14b8a6'],

                textColor: '#ffffff',
                legendTextColor: '#ffffff',
                tickColor: 'rgba(255, 255, 255, 0.9)',
                title: '⭐ GitHub Stars Over Time',
                titleSize: 22,

                showEmoji: true
            },
            minimal: {
                colors: ['#64748b', '#475569', '#334155', '#1e293b', '#0f172a', '#94a3b8', '#cbd5e1', '#e2e8f0'],
                tension: 0,
                strokeWidth: 2,
                pointRadius: 0,
                pointStroke: '#fff',
                pointStrokeWidth: 2,
                fill: false,
                fillOpacity: '00',
                bgGradient: ['#ffffff', '#ffffff'],
                bgStroke: '#e5e7eb',
                gridColor: 'rgba(0, 0, 0, 0.05)',
                textColor: '#1f2937',
                legendTextColor: '#4a5568',
                tickColor: '#6b7280',
                title: 'GitHub Stars Over Time',
                titleSize: 18,

                showEmoji: false
            },
            vibrant: {
                colors: ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f7b731', '#ee5a6f', '#00d2d3', '#ff9ff3', '#54a0ff'],
                tension: 0.6,
                strokeWidth: 4,

                pointStroke: '#fff',
                pointStrokeWidth: 3,
                fill: true,
                fillOpacity: '40',

                bgStroke: 'rgba(255,255,255,0.3)',
                gridColor: 'rgba(255, 255, 255, 0.2)',
                textColor: '#ffffff',

                tickColor: 'rgba(255, 255, 255, 0.95)',
                title: '⭐ GitHub Stars Over Time',
                titleSize: 24,

                textColor: '#1f2937',
                legendTextColor: '#4a5568',
                tickColor: '#6b7280',
                title: '⭐ GitHub Stars Over Time',
                titleSize: 22,
                titleWeight: 700,
                showEmoji: true
            },
            neon: {
                colors: ['#8a2be2', '#00ffff', '#ff00ff', '#00ff00', '#ffff00', '#ff1493', '#00bfff', '#ff00ff'],
                tension: 0.5,
                strokeWidth: 4,
                pointRadius: 5,
                pointStroke: '#0a0a0a',
                pointStrokeWidth: 3,
                fill: true,
                fillOpacity: 'CC',
                bgGradient: ['#0a0a0a', '#1a0033', '#330066'],
                bgStroke: 'rgba(138, 43, 226, 0.5)',
                gridColor: 'rgba(138, 43, 226, 0.2)',
                textColor: '#ffffff',
                legendTextColor: '#ffffff',
                tickColor: 'rgba(255, 255, 255, 0.9)',
                title: '⭐ GitHub Stars Over Time',
                titleSize: 24,
                titleWeight: 800,
                showEmoji: true
            },
            corporate: {
                colors: ['#1e40af', '#059669', '#dc2626', '#7c3aed', '#ea580c', '#0891b2', '#be185d', '#475569'],
                tension: 0.2,
                strokeWidth: 2,
                pointRadius: 3,
                pointStroke: '#fff',
                pointStrokeWidth: 2,
                fill: false,
                fillOpacity: '10',
                bgGradient: ['#f8f9fa', '#e9ecef'],
                bgStroke: '#dee2e6',
                gridColor: 'rgba(0, 0, 0, 0.06)',
                textColor: '#1f2937',
                legendTextColor: '#4a5568',
                tickColor: '#6b7280',
                title: 'GitHub Stars Over Time',
                titleSize: 20,
                titleWeight: 600,
                showEmoji: false
            }
        };

        function getStyleConfig(style) {
            return STYLE_CONFIG[style] || STYLE_CONFIG.professional;
        }
    </script>
    <style>
        /* Chart container styles - theme-specific backgrounds */
        .chart-container {
            position: relative;
            height: 500px;
        }

        .chart-container.aesthetic {
            background: linear-gradient(135deg, #0f4c75 0%, #3282b8 50%, #bbe1fa 100%);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 
                inset 0 2px 8px rgba(0,0,0,0.1),
                0 8px 32px rgba(15, 76, 117, 0.3);
        }

        .chart-container.dark {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 
                inset 0 2px 8px rgba(0,0,0,0.3),
                0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .chart-container.minimal {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            box-shadow: none;
        }

        .chart-container.vibrant {
            background: linear-gradient(135deg, #ff6b6b 0%, #4ecdc4 50%, #45b7d1 100%);
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 
                inset 0 2px 8px rgba(0,0,0,0.1),
                0 8px 32px rgba(255, 107, 107, 0.3);
        }

        .chart-container.pastel {
            background: linear-gradient(135deg, #ffeaa7 0%, #fab1a0 50%, #fd79a8 100%);
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 
                inset 0 2px 8px rgba(0,0,0,0.05),
                0 8px 32px rgba(253, 121, 168, 0.2);
        }

        .chart-container.neon {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 50%, #330066 100%);
            border: 1px solid rgba(138, 43, 226, 0.5);
            box-shadow: 
                inset 0 2px 8px rgba(0,0,0,0.5),
                0 0 20px rgba(138, 43, 226, 0.3),
                0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .chart-container.corporate {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border: 2px solid #dee2e6;
            box-shadow: 
                inset 0 2px 4px rgba(0,0,0,0.06),
                0 4px 16px rgba(0,0,0,0.1);
        }

        /* Default professional style */
        .chart-container:not(.aesthetic):not(.dark):not(.minimal):not(.vibrant):not(.pastel):not(.neon):not(.corporate) {
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.04);
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- Header -->
        <div class="text-center mb-12">
            <h1 class="text-5xl font-bold text-gray-900 mb-4 bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">
                ⭐ GitHub Stars History
            </h1>
            <p class="text-xl text-gray-600">
                Visualize the growth of stars over time for any GitHub repository
            </p>
        </div>

        <!-- Access Token Card -->
        <div class="bg-white rounded-2xl shadow-lg p-6 mb-6 border border-gray-100">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4">GitHub Access Token (Optional)</h2>
            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex-1">
                    <label for="accessToken" class="block text-sm font-medium text-gray-700 mb-2">
                        Personal Access Token
                    </label>
                    <input 
                        type="password" 
                        id="accessToken" 
                        placeholder="ghp_xxxxxxxxxxxx" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                    />
                </div>
                <button 
                    onclick="saveAccessToken()" 
                    class="px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors shadow-md hover:shadow-lg self-end"
                >
                    Save Token
                </button>
            </div>
            <p class="text-sm text-gray-600 mt-4">
                Adding a token increases rate limits from 60 to 5,000 requests/hour. 
                <a href="https://github.com/settings/tokens" target="_blank" class="text-blue-600 hover:text-blue-700 font-medium">
                    Create token here →
                </a>
            </p>
            <div id="tokenStatus" class="mt-3"></div>
        </div>

        <!-- Add Repository Card -->
        <div class="bg-white rounded-2xl shadow-lg p-6 mb-6 border border-gray-100">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4">Add Repository</h2>
            
            <!-- Quick Input -->
            <div class="flex flex-col md:flex-row gap-4 mb-4">
                <div class="flex-2">
                    <label for="repoInput" class="block text-sm font-medium text-gray-700 mb-2">
                        Repository (owner/repo format)
                    </label>
                    <input 
                        type="text" 
                        id="repoInput" 
                        placeholder="e.g., facebook/react" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                    />
                </div>
                <button 
                    onclick="addRepository()" 
                    class="px-6 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold rounded-lg hover:from-blue-700 hover:to-indigo-700 transition-all shadow-md hover:shadow-lg self-end"
                >
                    Add Repository
                </button>
            </div>

            <!-- Separate Inputs -->
            <div class="flex flex-col md:flex-row gap-4 mb-4">
                <div class="flex-1">
                    <label for="owner" class="block text-sm font-medium text-gray-700 mb-2">
                        Owner/Username
                    </label>
                    <input 
                        type="text" 
                        id="owner" 
                        placeholder="e.g., facebook" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                    />
                </div>
                <div class="flex-1">
                    <label for="repo" class="block text-sm font-medium text-gray-700 mb-2">
                        Repository Name
                    </label>
                    <input 
                        type="text" 
                        id="repo" 
                        placeholder="e.g., react" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                    />
                </div>
            </div>

            <!-- Force Refresh Checkbox -->
            <div class="flex items-center gap-2 mb-4">
                <input 
                    type="checkbox" 
                    id="forceRefresh" 
                    class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
                />
                <label for="forceRefresh" class="text-sm font-medium text-gray-700">
                    Force refresh (ignore cache)
                </label>
            </div>

            <!-- Repositories List -->
            <div id="repositories" class="mb-4"></div>
            
            <!-- Clear All Button -->
            <div class="text-right">
                <button 
                    onclick="clearAllRepositories()" 
                    id="clearAllBtn" 
                    class="hidden px-6 py-2 bg-red-600 text-white font-semibold rounded-lg hover:bg-red-700 transition-colors shadow-md hover:shadow-lg"
                >
                    Clear All
                </button>
            </div>
        </div>

        <!-- Chart Card -->
        <div class="bg-white rounded-2xl shadow-lg p-6 mb-6 border border-gray-100 hidden" id="chartCard">
            <!-- Chart Header -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                <h2 class="text-2xl font-semibold text-gray-800">Stars History Chart</h2>
                <div class="flex items-center gap-3">
                    <label for="chartStyle" class="text-sm font-medium text-gray-700">Chart Style:</label>
                    <select 
                        id="chartStyle" 
                        onchange="updateChart()"
                        class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white text-gray-700 font-medium"
                    >
                        <option value="professional">Professional</option>
                        <option value="aesthetic">Aesthetic</option>
                        <option value="dark">Dark Mode</option>
                        <option value="minimal">Minimal</option>
                        <option value="vibrant">Vibrant</option>
                        <option value="pastel">Pastel</option>
                        <option value="neon">Neon</option>
                        <option value="corporate">Corporate</option>
                    </select>
                </div>
            </div>

            <!-- Stats -->
            <div id="stats" class="mb-6"></div>

            <!-- Chart Container -->
            <div class="chart-container rounded-xl p-6 mb-6" id="chartContainer">
                <canvas id="starsChart"></canvas>
            </div>

            <!-- Export Buttons -->
            <div class="flex flex-col sm:flex-row gap-4">
                <button 
                    onclick="exportChartAsImage()" 
                    class="flex-1 px-6 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold rounded-lg hover:from-blue-700 hover:to-indigo-700 transition-all shadow-md hover:shadow-lg"
                >
                    📥 Download Chart as PNG
                </button>
                <button 
                    onclick="generateMarkdown()" 
                    class="flex-1 px-6 py-3 bg-white border-2 border-gray-300 text-gray-700 font-semibold rounded-lg hover:bg-gray-50 hover:border-gray-400 transition-all shadow-sm hover:shadow-md"
                >
                    📝 Copy Markdown for README
                </button>
            </div>
        </div>

        <!-- Messages -->
        <div id="messages" class="mb-6"></div>
    </div>

    <script>
        let chart = null;
        let repositories = [];
        let chartData = {};
        let accessToken = null;

        // Load access token from localStorage on page load
        function loadAccessToken() {
            const savedToken = localStorage.getItem('github_access_token');
            if (savedToken) {
                accessToken = savedToken;
                document.getElementById('accessToken').value = savedToken;
                updateTokenStatus(true);
            }
        }

        // Save access token to localStorage
        function saveAccessToken() {
            const token = document.getElementById('accessToken').value.trim();
            if (token) {
                accessToken = token;
                localStorage.setItem('github_access_token', token);
                updateTokenStatus(true);
                showMessage('Access token saved successfully!', 'info');
            } else {
                // Clear token
                accessToken = null;
                localStorage.removeItem('github_access_token');
                updateTokenStatus(false);
                showMessage('Access token cleared', 'info');
            }
        }

        // Update token status display
        function updateTokenStatus(hasToken) {
            const statusDiv = document.getElementById('tokenStatus');
            if (hasToken) {
                statusDiv.innerHTML = '<span class="text-green-600 font-semibold">✓ Token saved</span>';
            } else {
                statusDiv.innerHTML = '<span class="text-gray-500">No token saved</span>';
            }
        }

        // Clear all repositories
        function clearAllRepositories() {
            if (repositories.length === 0) return;
            
            if (confirm('Are you sure you want to clear all repositories?')) {
                repositories = [];
                chartData = {};
                updateRepositoriesList();
                updateChart();
                showMessage('All repositories cleared', 'info');
                // Update URL
                updateURL();
            }
        }

        // Parse repository input (supports "owner/repo" format)
        function parseRepositoryInput(input) {
            input = input.trim();
            if (!input) return null;

            // Check if it's in "owner/repo" format
            if (input.includes('/')) {
                const parts = input.split('/').map(p => p.trim());
                if (parts.length === 2 && parts[0] && parts[1]) {
                    return { owner: parts[0], repo: parts[1] };
                }
            }

            return null;
        }

        function addRepository() {
            // Try to parse from repoInput first
            const repoInput = document.getElementById('repoInput').value.trim();
            let owner, repo;

            if (repoInput) {
                const parsed = parseRepositoryInput(repoInput);
                if (parsed) {
                    owner = parsed.owner;
                    repo = parsed.repo;
                } else {
                    showMessage('Invalid format. Use "owner/repo" (e.g., facebook/react)', 'error');
                    return;
                }
            } else {
                // Fall back to separate fields
                owner = document.getElementById('owner').value.trim();
                repo = document.getElementById('repo').value.trim();
            }

            if (!owner || !repo) {
                showMessage('Please enter both owner and repository name', 'error');
                return;
            }

            const repoKey = `${owner}/${repo}`;
            if (repositories.some(r => r.key === repoKey)) {
                showMessage('Repository already added', 'error');
                return;
            }

            repositories.push({ owner, repo, key: repoKey });
            updateRepositoriesList();
            document.getElementById('owner').value = '';
            document.getElementById('repo').value = '';
            document.getElementById('repoInput').value = '';

            // Update URL
            updateURL();

            if (repositories.length > 0) {
                fetchStarsHistory();
            }
        }

        function removeRepository(key) {
            repositories = repositories.filter(r => r.key !== key);
            delete chartData[key];
            updateRepositoriesList();
            updateChart();
            // Update URL
            updateURL();
        }

        // Update URL with current repositories
        function updateURL() {
            if (repositories.length === 0) {
                window.history.replaceState({}, '', window.location.pathname);
                return;
            }

            const params = new URLSearchParams();
            if (repositories.length === 1) {
                params.set('repo', repositories[0].key);
            } else {
                params.set('repos', repositories.map(r => r.key).join(','));
            }
            window.history.replaceState({}, '', `${window.location.pathname}?${params.toString()}`);
        }

        // Load repositories from URL parameters
        function loadFromURL() {
            const params = new URLSearchParams(window.location.search);
            const repoParam = params.get('repo');
            const reposParam = params.get('repos');

            if (repoParam) {
                const parsed = parseRepositoryInput(repoParam);
                if (parsed) {
                    repositories.push({ 
                        owner: parsed.owner, 
                        repo: parsed.repo, 
                        key: `${parsed.owner}/${parsed.repo}` 
                    });
                }
            } else if (reposParam) {
                const repoList = reposParam.split(',').map(r => r.trim());
                repoList.forEach(repoStr => {
                    const parsed = parseRepositoryInput(repoStr);
                    if (parsed) {
                        const key = `${parsed.owner}/${parsed.repo}`;
                        if (!repositories.some(r => r.key === key)) {
                            repositories.push({ 
                                owner: parsed.owner, 
                                repo: parsed.repo, 
                                key: key 
                            });
                        }
                    }
                });
            }

            if (repositories.length > 0) {
                updateRepositoriesList();
                fetchStarsHistory();
            }
        }

        function updateRepositoriesList() {
            const container = document.getElementById('repositories');
            const clearAllBtn = document.getElementById('clearAllBtn');
            const chartCard = document.getElementById('chartCard');
            
            if (repositories.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-5">No repositories added yet</p>';
                chartCard.classList.add('hidden');
                clearAllBtn.classList.add('hidden');
                return;
            }

            clearAllBtn.classList.remove('hidden');
            container.innerHTML = repositories.map(r => `
                <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg border border-gray-200 mb-2">
                    <span class="font-medium text-gray-800">${r.key}</span>
                    <button 
                        onclick="removeRepository('${r.key}')" 
                        class="px-4 py-2 bg-red-600 text-white text-sm font-semibold rounded-lg hover:bg-red-700 transition-colors shadow-sm hover:shadow-md"
                    >
                        Remove
                    </button>
                </div>
            `).join('');
        }

        async function fetchStarsHistory() {
            const forceRefresh = document.getElementById('forceRefresh').checked;
            const btn = document.querySelector('button[onclick="addRepository()"]');
            if (btn) {
                btn.disabled = true;
                btn.textContent = 'Loading...';
            }

            showMessage('Fetching stars history...', 'info');

            try {
                if (repositories.length === 1) {
                    // Single repository
                    const repo = repositories[0];
                    const response = await fetch('/api/stars-history', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            owner: repo.owner,
                            repo: repo.repo,
                            forceRefresh,
                            accessToken: accessToken
                        })
                    });

                    const data = await response.json();
                    if (data.error) {
                        throw new Error(data.error);
                    }

                    chartData[repo.key] = data;
                } else {
                    // Multiple repositories
                    const response = await fetch('/api/multiple-stars-history', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            repositories: repositories.map(r => ({
                                owner: r.owner,
                                repo: r.repo
                            })),
                            forceRefresh,
                            accessToken: accessToken
                        })
                    });

                    const result = await response.json();
                    if (result.error) {
                        throw new Error(result.error);
                    }

                    result.repositories.forEach(data => {
                        if (!data.error) {
                            chartData[`${data.owner}/${data.repo}`] = data;
                        } else {
                            showMessage(`Error fetching ${data.owner}/${data.repo}: ${data.error}`, 'error');
                        }
                    });
                }

                updateChart();
                showMessage('Data loaded successfully!', 'info');
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
                console.error(error);
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = 'Add Repository';
                }
            }
        }

        function updateChart() {
            const chartCard = document.getElementById('chartCard');
            if (Object.keys(chartData).length === 0) {
                chartCard.classList.add('hidden');
                return;
            }

            chartCard.classList.remove('hidden');
            const ctx = document.getElementById('starsChart').getContext('2d');
            const chartStyle = document.getElementById('chartStyle').value;
            const chartContainer = document.getElementById('chartContainer');

            // Update container class based on style
            const styleClasses = {
                'professional': '',
                'aesthetic': ' aesthetic',
                'dark': ' dark',
                'minimal': ' minimal',
                'vibrant': ' vibrant',
                'pastel': ' pastel',
                'neon': ' neon',
                'corporate': ' corporate'
            };
            chartContainer.className = 'chart-container' + (styleClasses[chartStyle] || '');

            // Destroy existing chart
            if (chart) {
                chart.destroy();
            }

            // Prepare datasets
            const datasets = [];
            let colorIndex = 0;
            let allDates = new Set();

            // Collect all dates
            Object.values(chartData).forEach(data => {
                if (data.timeline) {
                    data.timeline.forEach(point => allDates.add(point.date));
                }
            });

            const sortedDates = Array.from(allDates).sort();

            // Get style configuration
            const styleConfig = getStyleConfig(chartStyle);

            // Create datasets for each repository
            Object.entries(chartData).forEach(([key, data]) => {
                if (!data.timeline) return;

                const timelineMap = {};
                data.timeline.forEach(point => {
                    timelineMap[point.date] = point.stars;
                });

                const starsData = sortedDates.map(date => {
                    // Find the last known star count up to this date
                    let lastCount = 0;
                    for (let i = 0; i < sortedDates.length; i++) {
                        if (sortedDates[i] > date) break;
                        lastCount = timelineMap[sortedDates[i]] || lastCount;
                    }
                    return lastCount;
                });

                // Get color based on style
                let color, gradient;
                if (chartStyle === 'aesthetic' && Array.isArray(styleConfig.colors[0])) {
                    // Aesthetic uses gradient
                    gradient = styleConfig.colors[colorIndex % styleConfig.colors.length];
                    color = gradient.start;
                } else {
                    color = styleConfig.colors[colorIndex % styleConfig.colors.length];
                }

                // Create dataset configuration
                const dataset = {
                        label: key,
                        data: starsData,
                    borderWidth: styleConfig.strokeWidth,
                    fill: styleConfig.fill,
                    tension: styleConfig.tension,
                    pointRadius: styleConfig.pointRadius,
                    pointHoverRadius: styleConfig.pointRadius * 2.5,
                        pointBackgroundColor: color,
                    pointBorderColor: styleConfig.pointStroke,
                    pointBorderWidth: styleConfig.pointStrokeWidth,
                    pointHoverBorderWidth: styleConfig.pointStrokeWidth + 1,
                    pointHoverBackgroundColor: styleConfig.pointStroke === '#fff' ? '#fff' : color
                };

                // Handle gradients for aesthetic style
                if (chartStyle === 'aesthetic' && gradient) {
                    const gradientFill = ctx.createLinearGradient(0, 0, 0, 400);
                    gradientFill.addColorStop(0, gradient.start + '80');
                    gradientFill.addColorStop(1, gradient.end + '10');
                    const gradientStroke = ctx.createLinearGradient(0, 0, 0, 400);
                    gradientStroke.addColorStop(0, gradient.start);
                    gradientStroke.addColorStop(1, gradient.end);
                    dataset.borderColor = gradientStroke;
                    dataset.backgroundColor = gradientFill;
                    dataset.pointBackgroundColor = gradient.start;
                    dataset.pointHoverBorderColor = gradient.start;
                } else {
                    // Solid colors
                    dataset.borderColor = color;
                    if (styleConfig.fill) {
                        dataset.backgroundColor = color + styleConfig.fillOpacity;
                    } else {
                        dataset.backgroundColor = 'transparent';
                    }
                }

                // Special handling for neon style
                if (chartStyle === 'neon') {
                    const neonGlow = ctx.createLinearGradient(0, 0, 0, 400);
                    neonGlow.addColorStop(0, color + 'CC');
                    neonGlow.addColorStop(1, color + '20');
                    dataset.backgroundColor = neonGlow;
                    dataset.shadowBlur = 10;
                    dataset.shadowColor = color;
                }

                datasets.push(dataset);
                colorIndex++;
            });

            // Update stats
            updateStats();

            // Chart options based on style - using shared config
            const getAnimationDuration = (style) => {
                const longAnimations = ['aesthetic', 'vibrant', 'neon', 'pastel'];
                return longAnimations.includes(style) ? 2000 : 1000;
            };
            
            const baseOptions = {
                responsive: true,
                maintainAspectRatio: false,
                animation: {
                    duration: getAnimationDuration(chartStyle),
                    easing: 'easeInOutQuart'
                },
                interaction: {
                    mode: 'nearest',
                    axis: 'x',
                    intersect: false
                }
            };
            
            // Determine if dark theme
            const isDark = ['dark', 'neon', 'aesthetic'].includes(chartStyle) || 
                          (chartStyle === 'vibrant' || chartStyle === 'pastel');
            
            // Tooltip background based on theme
            const tooltipBg = isDark 
                ? (chartStyle === 'dark' ? 'rgba(26, 26, 46, 0.95)' : 'rgba(10, 10, 10, 0.95)')
                : 'rgba(255, 255, 255, 0.98)';
            const tooltipText = isDark ? '#ffffff' : '#1f2937';
            const tooltipBody = isDark ? '#e2e8f0' : '#4a5568';

            // Title text with emoji handling
            const titleText = styleConfig.showEmoji ? styleConfig.title : styleConfig.title.replace('⭐ ', '');
            const emoji = styleConfig.showEmoji ? '⭐ ' : '';
            
            // Create unified chart options using style config
                chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: sortedDates,
                        datasets: datasets
                    },
                    options: {
                        ...baseOptions,
                        plugins: {
                            title: {
                                display: true,
                            text: titleText,
                                font: { 
                                size: styleConfig.titleSize,
                                weight: String(styleConfig.titleWeight),
                                    family: "'Segoe UI', sans-serif"
                                },
                            color: styleConfig.textColor,
                            padding: { bottom: chartStyle === 'professional' ? 20 : 25 }
                            },
                            legend: {
                                display: true,
                                position: 'top',
                                align: 'end',
                                labels: {
                                    usePointStyle: true,
                                pointStyle: 'circle',
                                padding: chartStyle === 'professional' ? 15 : 20,
                                font: { 
                                    size: chartStyle === 'professional' ? 13 : 14, 
                                    weight: chartStyle === 'professional' ? '500' : '600' 
                                },
                                color: styleConfig.legendTextColor
                                }
                            },
                            tooltip: {
                                mode: 'index',
                                intersect: false,
                            backgroundColor: tooltipBg,
                            padding: chartStyle === 'professional' ? 12 : 15,
                            titleFont: { 
                                size: chartStyle === 'professional' ? 14 : 15, 
                                weight: chartStyle === 'professional' ? '600' : '700' 
                            },
                            bodyFont: { 
                                size: chartStyle === 'professional' ? 13 : 14, 
                                weight: chartStyle === 'professional' ? '400' : '500' 
                            },
                            titleColor: tooltipText,
                            bodyColor: tooltipBody,
                            borderColor: isDark ? 'rgba(255, 255, 255, 0.2)' : 'rgba(0, 0, 0, 0.1)',
                            borderWidth: chartStyle === 'professional' ? 1 : 2,
                                displayColors: true,
                            boxPadding: chartStyle === 'professional' ? 6 : 8,
                                callbacks: {
                                    label: function(context) {
                                        return emoji + context.dataset.label + ': ' + context.parsed.y.toLocaleString() + ' stars';
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                display: true,
                                grid: {
                                    display: true,
                                color: styleConfig.gridColor,
                                    drawBorder: false
                                },
                                ticks: {
                                font: { 
                                    size: chartStyle === 'professional' ? 11 : 12, 
                                    weight: chartStyle === 'professional' ? '400' : '500' 
                                },
                                color: styleConfig.tickColor,
                                    maxRotation: 45,
                                    minRotation: 0
                                },
                                title: {
                                    display: true,
                                text: (styleConfig.showEmoji ? '📅 ' : '') + 'Date',
                                font: { 
                                    size: chartStyle === 'professional' ? 13 : 14, 
                                    weight: '600' 
                                },
                                color: styleConfig.textColor,
                                padding: { top: chartStyle === 'professional' ? 10 : 15 }
                                }
                            },
                            y: {
                                display: true,
                                grid: {
                                    display: true,
                                color: styleConfig.gridColor,
                                    drawBorder: false
                                },
                                ticks: {
                                font: { 
                                    size: chartStyle === 'professional' ? 11 : 12, 
                                    weight: chartStyle === 'professional' ? '400' : '500' 
                                },
                                color: styleConfig.tickColor,
                                    callback: function(value) {
                                        return value.toLocaleString();
                                    }
                                },
                                title: {
                                    display: true,
                                text: emoji + 'Number of Stars',
                                font: { 
                                    size: chartStyle === 'professional' ? 13 : 14, 
                                    weight: '600' 
                                },
                                color: styleConfig.textColor,
                                padding: { bottom: chartStyle === 'professional' ? 10 : 15 }
                                },
                                beginAtZero: true
                            }
                        }
                    }
                });
        }

        function updateStats() {
            const statsContainer = document.getElementById('stats');
            const stats = [];

            Object.entries(chartData).forEach(([key, data]) => {
                if (data.timeline && data.timeline.length > 0) {
                    const latest = data.timeline[data.timeline.length - 1];
                    stats.push({
                        repo: key,
                        total: latest.stars,
                        cached: data.cached
                    });
                }
            });

            if (stats.length === 0) {
                statsContainer.innerHTML = '';
                return;
            }

            statsContainer.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6';
            statsContainer.innerHTML = stats.map(stat => `
                <div class="bg-gradient-to-br from-blue-600 to-indigo-600 rounded-xl p-6 text-center text-white shadow-lg hover:shadow-xl transition-shadow">
                    <h3 class="text-4xl font-bold mb-2">${stat.total.toLocaleString()}</h3>
                    <p class="text-blue-100 font-medium mb-1">${stat.repo}</p>
                    ${stat.cached ? '<p class="text-xs text-blue-200 opacity-75">(cached)</p>' : ''}
                </div>
            `).join('');
        }

        function showMessage(message, type) {
            const messagesContainer = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            
            const typeClasses = {
                'error': 'bg-red-50 border-l-4 border-red-500 text-red-700',
                'info': 'bg-blue-50 border-l-4 border-blue-500 text-blue-700',
                'success': 'bg-green-50 border-l-4 border-green-500 text-green-700'
            };
            
            messageDiv.className = `p-4 rounded-lg shadow-md mb-4 ${typeClasses[type] || typeClasses.info}`;
            messageDiv.textContent = message;
            messagesContainer.innerHTML = '';
            messagesContainer.appendChild(messageDiv);

            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }

        // Allow Enter key to add repository
        document.getElementById('repo').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addRepository();
            }
        });

        document.getElementById('repoInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addRepository();
            }
        });

        document.getElementById('accessToken').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                saveAccessToken();
            }
        });

        // Export chart as PNG image
        function exportChartAsImage() {
            if (!chart) {
                showMessage('No chart to export', 'error');
                return;
            }

            try {
                const url = chart.toBase64Image('image/png', 1.0);
                const link = document.createElement('a');
                link.download = `github-stars-chart-${new Date().toISOString().split('T')[0]}.png`;
                link.href = url;
                link.click();
                showMessage('Chart downloaded successfully!', 'info');
            } catch (error) {
                showMessage('Error exporting chart: ' + error.message, 'error');
            }
        }

        // Generate markdown for README
        function generateMarkdown() {
            if (!chart || Object.keys(chartData).length === 0) {
                showMessage('No chart data to export', 'error');
                return;
            }

            const repoList = Object.keys(chartData);
            const currentUrl = window.location.origin;
            const currentStyle = document.getElementById('chartStyle').value;
            
            // Generate short markdown format similar to star-history.com
            // Format: [![Star History Chart](image-url)](link-url)
            // Use dynamic API endpoint that auto-updates with current chart style
            let markdown;
            
            if (repoList.length === 1) {
                // Single repository - use dynamic image endpoint with style
                const repo = repoList[0];
                const imageUrl = `${currentUrl}/api/chart-image?repos=${encodeURIComponent(repo)}&style=${encodeURIComponent(currentStyle)}`;
                const linkUrl = `${currentUrl}?repo=${encodeURIComponent(repo)}`;
                
                markdown = `[![Star History Chart](${imageUrl})](${linkUrl})`;
            } else {
                // Multiple repositories - use dynamic image endpoint with style
                const reposParam = repoList.join(',');
                const imageUrl = `${currentUrl}/api/chart-image?repos=${encodeURIComponent(reposParam)}&style=${encodeURIComponent(currentStyle)}`;
                const linkUrl = `${currentUrl}?repos=${encodeURIComponent(reposParam)}`;
                
                markdown = `[![Star History Chart](${imageUrl})](${linkUrl})`;
            }

            // Copy to clipboard
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(markdown).then(() => {
                    showMessage('✅ Markdown copied to clipboard! Paste it in your README.md file', 'info');
                    
                    // Also log to console for easy access
                    console.log('=== MARKDOWN FOR README ===');
                    console.log(markdown);
                    console.log('==========================');
                }).catch(() => {
                    // Fallback method
                    copyToClipboardFallback(markdown);
                });
            } else {
                // Fallback method for older browsers
                copyToClipboardFallback(markdown);
            }
        }

        // Fallback method to copy to clipboard
        function copyToClipboardFallback(text) {
            try {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                textarea.style.left = '-999999px';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showMessage('✅ Markdown copied to clipboard! Paste it in your README.md file', 'info');
                
                // Also log to console
                console.log('=== MARKDOWN FOR README ===');
                console.log(text);
                console.log('==========================');
            } catch (error) {
                showMessage('Error copying to clipboard. Check console for markdown code.', 'error');
                console.log('=== MARKDOWN FOR README ===');
                console.log(text);
                console.log('==========================');
            }
        }

        // Initialize
        loadAccessToken();
        // Load from URL first (which will call updateRepositoriesList if needed)
        loadFromURL();
        // If no URL params, show empty state
        if (repositories.length === 0) {
            updateRepositoriesList();
        }
    </script>
</body>
